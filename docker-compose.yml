services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: aivana
      POSTGRES_PASSWORD: aivana
      POSTGRES_DB: aivana
    ports:
      - "5432:5432"
    volumes:
      - aivana_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aivana -d aivana"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - aivana_redis:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  aivana_pg:
  aivana_redis:
